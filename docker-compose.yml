# Optional — swap SQLite for Postgres once you're past solo local dev.
# Point DATABASE_URL at this from backend/.env:
#   DATABASE_URL=postgresql://explore:explore@localhost:5432/explore
version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: explore
      POSTGRES_PASSWORD: explore
      POSTGRES_DB: explore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
