<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Mirmera (ምርመራ, "investigation"): a lens over an exploration trail that ends at a found bug</title>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5" fill="#0C0D0F" stroke="#2C3038" stroke-width="1.5"/>
  <!-- the trail a tester takes through the app: wandering, not scripted -->
  <polyline points="18.5,32 23.5,23.5 28.5,30.5 33.5,22.5" fill="none" stroke="#E8EAED" stroke-width="3.6"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18.5" cy="32" r="2.6" fill="#E8EAED"/>
  <!-- where it led: a bug -->
  <circle cx="33.5" cy="22.5" r="4" fill="#F0625D"/>
  <!-- the lens: looking closely -->
  <circle cx="27" cy="27" r="16" fill="none" stroke="#3ED598" stroke-width="5.5"/>
  <line x1="39" y1="39" x2="51.5" y2="51.5" stroke="#3ED598" stroke-width="7.5" stroke-linecap="round"/>
</svg>
