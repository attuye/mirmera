# Mirmera on one server. From the repository folder on the server:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Settings and secrets: deploy/.env (copy deploy/.env.example). Data: MIRMERA_DATA.
#
# Both services use the host's network: the backend listens on 127.0.0.1:8000 only (not
# reachable from outside), Caddy on 80/443, and the backend reaches the AI model at
# 127.0.0.1:11434: the tunnel from your laptop (scripts/qwen-tunnel), or the ollama
# service below.
name: mirmera

services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile, target: app }
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/mirmera.db
      EVIDENCE_DIR: /data/evidence
      SECRET_KEY_FILE: /data/secret.key
      RUNNER_HEADLESS: "true"  # a server has no screen
    volumes:
      - ${MIRMERA_DATA:-/srv/mirmera-data}:/data
    shm_size: 1gb  # Chromium needs more shared memory than Docker's 64 MB
    init: true     # reaps the browser processes Chromium leaves behind
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - caddy-data:/data      # the certificates: keep them, or Let's Encrypt's limits bite
      - caddy-config:/config
    depends_on: [app]
    restart: unless-stopped

  # Only if the model runs on this server (16 GB+ RAM, slow without a GPU):
  #   docker compose -f deploy/docker-compose.yml --profile ollama up -d
  # then: docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen3:8b
  # Don't run it together with the laptop tunnel: both use port 11434.
  ollama:
    image: ollama/ollama:latest  # pin a version once it works for you
    profiles: [ollama]
    network_mode: host
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  ollama:
